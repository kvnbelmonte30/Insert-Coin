services:
  postgres:
    image: postgres:16-alpine
    container_name: maquinitas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maquinitas
      POSTGRES_USER: maquinitas
      POSTGRES_PASSWORD: maquinitas_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
